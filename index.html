<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Daily - 당신의 신비로운 매일</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0F172A; color: white; font-family: 'Pretendard', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(to right, #A855F7, #6366F1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .scroll-container::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <header class="max-w-md mx-auto mb-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold flex items-center gap-2">
            <span class="text-purple-400">🌙</span> Mystic Daily
        </h1>
    </header>

    <main class="max-w-md mx-auto space-y-6">
        
        <!-- 띠별 운세 선택 -->
        <section>
            <h3 class="text-sm text-purple-300 mb-3 font-semibold uppercase tracking-wider">띠별 운세</h3>
            <div class="grid grid-cols-4 gap-2">
                <script>
                    const zodiacs = [
                        {n: '쥐', i: '🐭', m: '작은 노력들이 모여 큰 결과를 만듭니다. 금전적으로는 여유가 생기겠군요.'},
                        {n: '소', i: '🐮', m: '우직함이 빛을 발합니다. 오늘은 성실함 하나로 모든 상황을 극복할 수 있어요.'},
                        {n: '호랑이', i: '🐯', m: '강한 에너지가 넘칩니다. 새로운 일에 도전하기에 아주 완벽한 날입니다.'},
                        {n: '토끼', i: '🐰', m: '대인관계에서 행운이 따릅니다. 누군가 당신에게 도움을 요청한다면 들어주세요.'},
                        {n: '용', i: '🐲', m: '운의 흐름이 매우 좋습니다. 머릿속에 있던 아이디어를 현실로 옮겨보세요.'},
                        {n: '뱀', i: '🐍', m: '직관력이 예민해집니다. 당신의 첫 느낌이 정답일 가능성이 높습니다.'},
                        {n: '말', i: '🐴', m: '활기찬 하루입니다. 주변 사람들과 함께 협력하면 시너지가 폭발할 거예요.'},
                        {n: '양', i: '🐑', m: '평화로운 일상이 예상됩니다. 갈등은 피하고 마음의 안정을 찾으세요.'},
                        {n: '원숭이', i: '🐵', m: '재치가 빛나는 날입니다. 언변을 통해 사람들의 마음을 사로잡을 수 있어요.'},
                        {n: '닭', i: '🐔', m: '부지런함이 성공을 부릅니다. 계획했던 일들을 차근차근 실행해 보세요.'},
                        {n: '개', i: '🐶', m: '충실함이 보상받는 날입니다. 신뢰를 바탕으로 좋은 결과가 기다리고 있어요.'},
                        {n: '돼지', i: '🐷', m: '재물운이 따라옵니다. 뜻밖의 이득이나 기분 좋은 소식이 들려올 거예요.'}
                    ];
                    zodiacs.forEach(z => {
                        document.write(`<button onclick="showModal('${z.n}띠 운세', '${z.m}')" class="glass-card p-2 rounded-xl text-xs hover:bg-slate-700 transition flex flex-col items-center gap-1">${z.i}<br>${z.n}띠</button>`);
                    });
                </script>
            </div>
        </section>

        <!-- 별자리 운세 선택 -->
        <section>
            <h3 class="text-sm text-purple-300 mb-3 font-semibold uppercase tracking-wider">별자리 운세</h3>
            <div class="grid grid-cols-4 gap-2">
                <script>
                    const constellations = [
                        {n: '양', i: '♈', m: '열정적인 하루가 예상됩니다. 목표를 향해 정면 돌파해 보세요.'},
                        {n: '황소', i: '♉', m: '안정적인 운세입니다. 서두르지 말고 현재의 페이스를 유지하세요.'},
                        {n: '쌍둥이', i: '♊', m: '다양한 소식이 들려오네요. 선택의 갈림길에 있다면 소신을 믿으세요.'},
                        {n: '게', i: '♋', m: '감수성이 풍부해지는 날입니다. 따뜻한 차 한 잔으로 여유를 즐겨보세요.'},
                        {n: '사자', i: '♌', m: '리더십이 돋보입니다. 당신의 결단력이 모두를 올바른 방향으로 이끕니다.'},
                        {n: '처녀', i: '♍', m: '꼼꼼한 분석력이 빛납니다. 실수를 줄이고 완벽을 기하기 좋습니다.'},
                        {n: '천칭', i: '♎', m: '균형 감각이 필요한 날입니다. 한쪽으로 치우치지 않게 주의하세요.'},
                        {n: '전갈', i: '♏', m: '집중력이 상승합니다. 복잡한 문제를 단숨에 해결할 수 있어요.'},
                        {n: '사수', i: '♐', m: '활동적인 에너지가 가득합니다. 새로운 장소로 떠나보는 것도 좋습니다.'},
                        {n: '염소', i: '♑', m: '인내심을 가지세요. 지금 뿌린 씨앗이 조만간 열매를 맺을 것입니다.'},
                        {n: '물병', i: '♒', m: '창의적인 영감이 가득합니다. 엉뚱한 상상이 대박으로 이어집니다.'},
                        {n: '물고기', i: '♓', m: '공감 능력이 탁월합니다. 주변 사람의 마음을 치유해 주는 하루가 될 거예요.'}
                    ];
                    constellations.forEach(c => {
                        document.write(`<button onclick="showModal('${c.n}자리 운세', '${c.m}')" class="glass-card p-2 rounded-xl text-xs hover:bg-slate-700 transition flex flex-col items-center gap-1">${c.i}<br>${c.n}자리</button>`);
                    });
                </script>
            </div>
        </section>

        <!-- 포춘 쿠키 뽑기 -->
        <section>
            <button onclick="showFortuneCookie()" class="w-full glass-card p-8 rounded-3xl flex flex-col items-center justify-center gap-4 hover:bg-purple-900/20 transition-all transform hover:scale-[1.02] border-2 border-purple-500/30">
                <span class="text-6xl">🥠</span>
                <span class="text-xl font-bold text-white">오늘의 운세 총점 뽑기</span>
                <span class="text-sm text-purple-300">종합적인 오늘을 확인하세요</span>
            </button>
        </section>
    </main>

    <!-- 모달창 -->
    <div id="fortuneModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50" onclick="closeModal()">
        <div class="glass-card p-8 rounded-3xl w-full max-w-sm text-center" onclick="event.stopPropagation()">
            <h3 id="modalTitle" class="text-xl font-bold text-purple-400 mb-4"></h3>
            <div id="modalContent" class="text-gray-200 mb-6 text-sm space-y-4"></div>
            <button onclick="closeModal()" class="bg-indigo-600 px-6 py-2 rounded-full hover:bg-indigo-500 transition">확인</button>
        </div>
    </div>

    <script>
        function showModal(title, content) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalContent').innerHTML = `<p>${content}</p>`;
            document.getElementById('fortuneModal').classList.remove('hidden');
        }

        function showFortuneCookie() {
            const title = "🥠 종합 운세 결과지";
            const content = `
                <div class="text-4xl font-bold gradient-text mb-2">87점</div>
                <p class="italic text-gray-300 mb-4">"새로운 기회가 예상치 못한 곳에서 찾아옵니다."</p>
                <div class="grid grid-cols-2 gap-2 text-xs mb-6">
                    <div class="bg-slate-800 p-2 rounded-lg">색상: <span class="text-purple-400">보라색</span></div>
                    <div class="bg-slate-800 p-2 rounded-lg">숫자: <span class="text-yellow-400">7</span></div>
                </div>
                <div class="text-left space-y-2">
                    <p>❤️ <b>연애:</b> 오늘은 사랑이 꽃피는 날입니다.</p>
                    <p>💰 <b>금전:</b> 뜻밖의 횡재수가 있습니다.</p>
                    <p>💼 <b>직장:</b> 능력을 인정받는 날입니다.</p>
                    <p>🏃 <b>건강:</b> 활력이 넘치는 날입니다.</p>
                </div>
            `;
            showModal(title, content);
        }

        function closeModal() {
            document.getElementById('fortuneModal').classList.add('hidden');
        }
    </script>
</body>
</html>
