<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Daily - 당신의 신비로운 매일</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0F172A; color: white; font-family: 'Pretendard', sans-serif; overflow-x: hidden; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(to right, #A855F7, #6366F1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #particleCanvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 100; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <canvas id="particleCanvas"></canvas>

    <header class="max-w-md mx-auto mb-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold flex items-center gap-2">
            <span class="text-purple-400">🌙</span> Mystic Daily
        </h1>
    </header>

    <main class="max-w-md mx-auto space-y-6">
        
        <section>
            <h3 class="text-sm text-purple-300 mb-3 font-semibold uppercase tracking-wider">띠별 운세</h3>
            <div class="grid grid-cols-4 gap-2">
                <script>
                    const zodiacs = [
                        {n: '쥐', i: '🐭', m: '작은 노력들이 모여 큰 결과를 만듭니다.'},
                        {n: '소', i: '🐮', m: '우직함이 빛을 발합니다. 성실함이 최고의 무기입니다.'},
                        {n: '호랑이', i: '🐯', m: '강한 에너지가 넘칩니다. 새로운 일에 도전하세요.'},
                        {n: '토끼', i: '🐰', m: '대인관계에서 행운이 따릅니다. 타인을 배려해보세요.'},
                        {n: '용', i: '🐲', m: '운의 흐름이 매우 좋습니다. 아이디어를 현실로 옮기세요.'},
                        {n: '뱀', i: '🐍', m: '직관력이 예민해집니다. 첫 느낌을 믿어보세요.'},
                        {n: '말', i: '🐴', m: '활기찬 하루입니다. 협력하면 큰 성과를 냅니다.'},
                        {n: '양', i: '🐑', m: '평화로운 일상이 예상됩니다. 마음의 안정을 찾으세요.'},
                        {n: '원숭이', i: '🐵', m: '재치가 빛나는 날입니다. 사람들을 즐겁게 하세요.'},
                        {n: '닭', i: '🐔', m: '부지런함이 성공을 부릅니다. 차근차근 실행하세요.'},
                        {n: '개', i: '🐶', m: '충실함이 보상받는 날입니다. 신뢰를 쌓으세요.'},
                        {n: '돼지', i: '🐷', m: '재물운이 따라옵니다. 뜻밖의 이득을 기대하세요.'}
                    ];
                    zodiacs.forEach(z => {
                        document.write(`<button onclick="handleButtonClick('${z.n}띠 운세', '${z.m}')" class="glass-card p-2 rounded-xl text-xs hover:bg-slate-700 transition flex flex-col items-center gap-1">${z.i}<br>${z.n}띠</button>`);
                    });
                </script>
            </div>
        </section>

        <section>
            <h3 class="text-sm text-purple-300 mb-3 font-semibold uppercase tracking-wider">별자리 운세</h3>
            <div class="grid grid-cols-4 gap-2">
                <script>
                    const constellations = [
                        {n: '양', i: '♈', m: '열정적인 하루! 목표를 향해 돌파하세요.'},
                        {n: '황소', i: '♉', m: '안정적인 운세입니다. 페이스를 유지하세요.'},
                        {n: '쌍둥이', i: '♊', m: '다양한 소식이 들려오네요. 소신을 지키세요.'},
                        {n: '게', i: '♋', m: '감수성이 풍부해지는 날입니다. 따뜻한 차 한 잔 하세요.'},
                        {n: '사자', i: '♌', m: '리더십이 돋보입니다. 결단력을 보여주세요.'},
                        {n: '처녀', i: '♍', m: '꼼꼼한 분석력이 빛납니다. 실수를 줄이세요.'},
                        {n: '천칭', i: '♎', m: '균형 감각이 중요합니다. 중립을 지키세요.'},
                        {n: '전갈', i: '♏', m: '집중력이 상승합니다. 복잡한 일을 해결하세요.'},
                        {n: '사수', i: '♐', m: '활동적인 에너지! 새로운 곳으로 떠나보세요.'},
                        {n: '염소', i: '♑', m: '인내심이 보상받을 때입니다. 결과가 곧 나타납니다.'},
                        {n: '물병', i: '♒', m: '창의적인 영감이 가득합니다. 상상력을 발휘하세요.'},
                        {n: '물고기', i: '♓', m: '공감 능력이 탁월합니다. 주변 사람을 위로하세요.'}
                    ];
                    constellations.forEach(c => {
                        document.write(`<button onclick="handleButtonClick('${c.n}자리 운세', '${c.m}')" class="glass-card p-2 rounded-xl text-xs hover:bg-slate-700 transition flex flex-col items-center gap-1">${c.i}<br>${c.n}자리</button>`);
                    });
                </script>
            </div>
        </section>

        <section>
            <button onclick="handleButtonClick('🥠 종합 운세 결과지', '87점: 새로운 기회가 예상치 못한 곳에서 찾아옵니다. 오늘 당신의 운세는 매우 밝습니다!')" class="w-full glass-card p-8 rounded-3xl flex flex-col items-center justify-center gap-4 hover:bg-purple-900/20 transition-all transform hover:scale-[1.02] border-2 border-purple-500/30">
                <span class="text-6xl">🥠</span>
                <span class="text-xl font-bold text-white">포춘 쿠키 뽑기</span>
                <span class="text-sm text-purple-300">종합적인 오늘을 확인하세요</span>
            </button>
        </section>
    </main>

    <div id="fortuneModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50" onclick="closeModal()">
        <div class="glass-card p-8 rounded-3xl w-full max-w-sm text-center" onclick="event.stopPropagation()">
            <h3 id="modalTitle" class="text-xl font-bold text-purple-400 mb-4"></h3>
            <div id="modalContent" class="text-gray-200 mb-6 text-sm space-y-4"></div>
            <button onclick="closeModal()" class="bg-indigo-600 px-6 py-2 rounded-full hover:bg-indigo-500 transition">확인</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                // 더 자잘한 조각을 위해 크기 범위를 낮춤
                this.size = Math.random() * 2 + 0.5;
                // 더 빠르게 퍼지도록 속도 범위를 높임
                this.speedX = Math.random() * 16 - 8;
                this.speedY = Math.random() * 16 - 8;
                this.color = `hsl(${Math.random() * 60 + 240}, 100%, 75%)`;
                this.life = 100;
                this.decay = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= this.decay;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        function triggerParticles(x, y) {
            // 더 많은 개수로 풍성하게 표현
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle(x, y));
            }
        }

        function handleButtonClick(title, content) {
            triggerParticles(window.innerWidth / 2, window.innerHeight / 2);
            showModal(title, content);
        }

        function showModal(title, content) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalContent').innerHTML = `<p>${content}</p>`;
            document.getElementById('fortuneModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('fortuneModal').classList.add('hidden');
        }
    </script>
</body>
</html>
